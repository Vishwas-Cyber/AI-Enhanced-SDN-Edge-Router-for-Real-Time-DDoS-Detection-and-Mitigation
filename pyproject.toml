[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-sentinel"
version = "1.0.0"
description = "Explainable closed-loop DDoS detection and OpenFlow mitigation for authorized SDN labs"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
