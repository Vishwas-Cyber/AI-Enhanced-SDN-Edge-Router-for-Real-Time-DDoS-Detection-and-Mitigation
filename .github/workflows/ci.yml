name: SDN Sentinel checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pyyaml
      - run: python -m py_compile dashboard/app.py src/runtime_contract.py
      - run: python -m pytest
